<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N4 日文打地鼠遊戲 (假名放大、漢字縮小版)</title>
  <style>
    body {
      font-family: "Hiragino Kaku Gothic Pro", "Meiryo", sans-serif;
      background-color: #f0f8ff;
      text-align: center;
      margin: 0;
      padding: 10px;
      color: #333;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 5px;
    }
    .info-panel {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .game-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 500px;
      margin: 0 auto;
    }
    .hole {
      background-color: #8b4513;
      border-radius: 15px;
      height: 130px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      box-shadow: inset 0 -10px 15px rgba(0,0,0,0.4);
    }
    .mole {
      background-color: #6a0dad;
      color: white;
      width: 90%;
      height: 95%;
      border-radius: 20px 20px 0 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: absolute;
      bottom: -100%;
      transition: bottom 0.3s ease-out;
      padding: 5px;
      box-sizing: border-box;
      text-align: center;
    }
    .mole.up {
      bottom: 0;
    }
    
    /* 統一漢字與送假名：縮小漢字基底字體 */
    .word-box {
      writing-mode: horizontal-tb; 
      white-space: nowrap; 
      display: inline-block;
      font-size: clamp(1rem, 3.5vw, 1.4rem); /* 縮小：從原本最大 1.8rem 降至 1.4rem */
      font-weight: bold;
    }

    /* 上方注音(ふりがな)設定：放大假名 */
    rt {
      color: skyblue;
      font-size: clamp(1.2rem, 4.5vw, 1.7rem); /* 放大：從原本最大 1.1rem 升至 1.7rem */
      padding-bottom: 2px;
    }

    ruby {
      margin: 0 1px;
    }

    .meaning {
      color: #ffeb3b;
      font-size: clamp(0.85rem, 3vw, 1.1rem);
      margin-top: 5px;
      font-weight: bold;
      white-space: normal; 
      word-wrap: break-word;
      line-height: 1.2;
    }

    /* 遊戲按鈕與結算面板 */
    .controls {
      margin-top: 20px;
    }
    button {
      font-size: 1.1rem;
      padding: 10px 20px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background-color: #4CAF50;
      color: white;
      font-weight: bold;
      margin: 5px;
    }
    button:hover {
      background-color: #45a049;
    }
    .replay-btn {
      background-color: #2196F3;
      padding: 5px 10px;
      font-size: 0.9rem;
    }
    
    #end-screen {
      display: none;
      background-color: white;
      border: 3px solid #333;
      border-radius: 15px;
      padding: 20px;
      max-width: 400px;
      margin: 20px auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .wrong-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      padding: 10px 0;
      text-align: left;
    }
    .wrong-text {
      flex: 1;
      margin-right: 10px;
      writing-mode: horizontal-tb;
    }
    .wrong-meaning {
      color: #d32f2f;
      font-size: 0.9rem;
      font-weight: bold;
    }
    .wrong-item ruby rt {
      color: #1976d2; 
    }
  </style>
</head>
<body>

  <h1>N4 打地鼠聽力特訓</h1>
  <div class="info-panel">
    <span>分數: <span id="score">0</span></span>
    <span>時間: <span id="time">40</span>s</span>
    <span>題數: <span id="question-count">0</span>/10</span>
  </div>

  <div class="game-board" id="board">
    <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
    <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
    <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
    <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
    <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
    <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
    <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
    <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
    <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
  </div>

  <div class="controls">
    <button id="start-btn" onclick="startGame()">開始遊戲</button>
    <button id="repeat-btn" onclick="repeatAudio()" style="display:none; background-color: #ff9800;">再聽一次</button>
  </div>

  <div id="end-screen">
    <h2>遊戲結束！</h2>
    <p>你的總分是: <span id="final-score"></span> / 100</p>
    <h3>答錯的題目：</h3>
    <div id="wrong-list"></div>
    <button onclick="location.reload()" style="margin-top:15px;">重新開始</button>
  </div>

  <script>
    const allVocab = [
      { speak: "あかちゃん", display: "<ruby>赤<rt>あか</rt></ruby>ちゃん", meaning: "嬰兒,寶寶" },
      { speak: "あき", display: "<ruby>秋<rt>あき</rt></ruby>", meaning: "秋天" },
      { speak: "あじ", display: "<ruby>味<rt>あじ</rt></ruby>", meaning: "味道" },
      { speak: "あめのひ", display: "<ruby>雨<rt>あめ</rt></ruby>の<ruby>日<rt>ひ</rt></ruby>", meaning: "雨天" },
      { speak: "いきもの", display: "<ruby>生<rt>い</rt></ruby>き<ruby>物<rt>もの</rt></ruby>", meaning: "生物,有生命的東西" },
      { speak: "いけん", display: "<ruby>意<rt>い</rt></ruby><ruby>見<rt>けん</rt></ruby>", meaning: "意見,建議" },
      { speak: "いちど", display: "<ruby>一<rt>いち</rt></ruby><ruby>度<rt>ど</rt></ruby>", meaning: "一次" },
      { speak: "いりぐち", display: "<ruby>入<rt>いり</rt></ruby><ruby>口<rt>ぐち</rt></ruby>", meaning: "入口" },
      { speak: "うんてん", display: "<ruby>運<rt>うん</rt></ruby><ruby>転<rt>てん</rt></ruby>", meaning: "駕駛;運轉" },
      { speak: "えがお", display: "<ruby>笑<rt>え</rt></ruby><ruby>顔<rt>がお</rt></ruby>", meaning: "笑容,笑臉" },
      { speak: "えきいん", display: "<ruby>駅<rt>えき</rt></ruby><ruby>員<rt>いん</rt></ruby>", meaning: "站務員" },
      { speak: "おいわい", display: "お<ruby>祝<rt>いわ</rt></ruby>い", meaning: "慶祝" },
      { speak: "かいがい", display: "<ruby>海<rt>かい</rt></ruby><ruby>外<rt>がい</rt></ruby>", meaning: "國外,海外" },
      { speak: "かいぎしつ", display: "<ruby>会<rt>かい</rt></ruby><ruby>議<rt>ぎ</rt></ruby><ruby>室<rt>しつ</rt></ruby>", meaning: "會議室" },
      { speak: "かじ", display: "<ruby>火<rt>か</rt></ruby><ruby>事<rt>じ</rt></ruby>", meaning: "火災" },
      { speak: "かぜ", display: "<ruby>風<rt>かぜ</rt></ruby>", meaning: "風" },
      { speak: "かみ", display: "<ruby>髪<rt>かみ</rt></ruby>", meaning: "頭髮" },
      { speak: "きおん", display: "<ruby>気<rt>き</rt></ruby><ruby>温<rt>おん</rt></ruby>", meaning: "氣溫" },
      { speak: "きって", display: "<ruby>切<rt>きっ</rt></ruby><ruby>手<rt>て</rt></ruby>", meaning: "郵票" },
      { speak: "きんし", display: "<ruby>禁<rt>きん</rt></ruby><ruby>止<rt>し</rt></ruby>", meaning: "禁止" }
    ];

    let score = 0;
    let time = 40;
    let questionsAsked = 0;
    let currentTarget = null;
    let gameTimer = null;
    let playing = false;
    let selectedQuestions = [];
    let wrongAnswers = [];
    
    const moles = document.querySelectorAll('.mole');
    const scoreDisplay = document.getElementById('score');
    const timeDisplay = document.getElementById('time');
    const questionCountDisplay = document.getElementById('question-count');

    function playSound(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = 1.0; 
        window.speechSynthesis.speak(utterance);
      }
    }

    function repeatAudio() {
      if (currentTarget) playSound(currentTarget.speak);
    }

    function startGame() {
      if (playing) return;
      playing = true;
      score = 0;
      time = 40;
      questionsAsked = 0;
      wrongAnswers = [];
      
      scoreDisplay.innerText = score;
      timeDisplay.innerText = time;
      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('repeat-btn').style.display = 'inline-block';
      document.getElementById('end-screen').style.display = 'none';
      document.getElementById('board').style.display = 'grid';

      let shuffledVocab = [...allVocab].sort(() => 0.5 - Math.random());
      selectedQuestions = shuffledVocab.slice(0, 10);

      gameTimer = setInterval(() => {
        time--;
        timeDisplay.innerText = time;
        if (time <= 0) endGame();
      }, 1000);

      nextRound();
    }

    function nextRound() {
      if (questionsAsked >= 10 || time <= 0) {
        endGame();
        return;
      }

      moles.forEach(mole => mole.classList.remove('up'));
      
      currentTarget = selectedQuestions[questionsAsked];
      questionsAsked++;
      questionCountDisplay.innerText = questionsAsked;

      playSound(currentTarget.speak);

      const moleCount = Math.floor(Math.random() * 7) + 3;
      
      let distractors = allVocab.filter(v => v.speak !== currentTarget.speak);
      distractors.sort(() => 0.5 - Math.random());
      let roundVocab = [currentTarget, ...distractors.slice(0, moleCount - 1)];
      roundVocab.sort(() => 0.5 - Math.random()); 

      let holeIndices = [0,1,2,3,4,5,6,7,8].sort(() => 0.5 - Math.random()).slice(0, moleCount);

      holeIndices.forEach((index, i) => {
        const mole = moles[index];
        mole.innerHTML = `<div class="word-box">${roundVocab[i].display}</div><div class="meaning">${roundVocab[i].meaning}</div>`;
        mole.dataset.speak = roundVocab[i].speak;
        mole.dataset.wordInfo = JSON.stringify(roundVocab[i]);
        mole.classList.add('up');
      });
    }

    function whack(mole) {
      if (!mole.classList.contains('up') || !playing) return;
      
      if (mole.dataset.speak === currentTarget.speak) {
        score += 10;
        scoreDisplay.innerText = score;
      } else {
        wrongAnswers.push(currentTarget);
      }
      
      moles.forEach(m => m.classList.remove('up'));
      setTimeout(nextRound, 400); 
    }

    function endGame() {
      playing = false;
      clearInterval(gameTimer);
      moles.forEach(mole => mole.classList.remove('up'));
      
      document.getElementById('board').style.display = 'none';
      document.getElementById('repeat-btn').style.display = 'none';
      document.getElementById('start-btn').style.display = 'inline-block';
      document.getElementById('start-btn').innerText = '重新開始';
      
      const endScreen = document.getElementById('end-screen');
      const finalScore = document.getElementById('final-score');
      const wrongList = document.getElementById('wrong-list');
      
      finalScore.innerText = score;
      wrongList.innerHTML = '';

      if (wrongAnswers.length === 0) {
        wrongList.innerHTML = '<p style="color:green; font-weight:bold;">太厲害了！全部答對！</p>';
      } else {
        wrongAnswers.forEach(item => {
          wrongList.innerHTML += `
            <div class="wrong-item">
              <div class="wrong-text">
                <div class="word-box">${item.display}</div><br>
                <span class="wrong-meaning">${item.meaning}</span>
              </div>
              <button class="replay-btn" onclick="playSound('${item.speak}')">▶ 發音</button>
            </div>
          `;
        });
      }
      
      endScreen.style.display = 'block';
    }
  </script>
</body>
</html>
